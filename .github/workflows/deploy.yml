name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            echo "🚀 Starting Automated Deployment on VPS..."
            
            PROJECT_DIR="${{ secrets.VPS_TARGET_DIR || '/root/dashcam-v1' }}"
            
            if [ ! -d "$PROJECT_DIR" ]; then
              echo "📂 Cloning repository to $PROJECT_DIR..."
              git clone https://github.com/${{ github.repository }}.git "$PROJECT_DIR"
            fi
            
            cd "$PROJECT_DIR"
            
            echo "📥 Pulling latest changes from main..."
            git reset --hard HEAD
            git pull origin main
            
            if [ -d "backend" ]; then
              echo "📦 Installing backend dependencies..."
              cd backend && npm install --production && cd ..
            fi
            
            # Restart specifically dashcam-backend
            echo "🔄 Restarting dashcam-backend in PM2..."
            pm2 restart dashcam-backend --update-env || pm2 start backend/ecosystem.config.js
            pm2 save
            
            echo "🎉 Deployment Completed Successfully without duplicate processes!"
