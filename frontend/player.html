<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dashcam Live Player</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      background-color: #000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #player-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #000;
    }
    .hud-overlay {
      position: absolute;
      top: 8px;
      left: 8px;
      right: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 10;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      color: #fff;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
    }
    .badge-live {
      background: #dc2626;
      animation: pulse 2s infinite;
    }
    .badge-live::before {
      content: "";
      width: 6px;
      height: 6px;
      margin-right: 5px;
      background: #fff;
      border-radius: 50%;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }
    #videoOverlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(15, 23, 42, 0.9);
      color: #fff;
      z-index: 20;
      text-align: center;
      padding: 16px;
      transition: opacity 0.3s ease;
    }
    #videoOverlay.hidden {
      display: none !important;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 255, 255, 0.2);
      border-top-color: #00f2fe;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 10px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .overlay-title {
      font-size: 13px;
      font-weight: 600;
      color: #e2e8f0;
    }
    .overlay-sub {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 4px;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/jmuxer@2.0.5/dist/jmuxer.min.js"></script>
</head>
<body>
  <div id="player-container">
    <video id="player" autoplay muted playsinline></video>
    
    <div class="hud-overlay">
      <div id="liveBadge" class="badge badge-live">LIVE</div>
      <div id="channelBadge" class="badge">CH 1 • FRONT</div>
      <div id="fpsBadge" class="badge" style="background: rgba(0,242,254,0.25); color: #00f2fe;">0 FPS</div>
    </div>

    <div id="videoOverlay">
      <div class="spinner"></div>
      <div id="overlayText" class="overlay-title">Connecting to Camera VPS...</div>
      <div id="overlaySub" class="overlay-sub">Negotiating JT1078 live video stream</div>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const simNo = urlParams.get('sim') || '015770054447';
    const channel = parseInt(urlParams.get('channel') || '1', 10);
    const streamType = parseInt(urlParams.get('streamType') || '1', 10); // 1 = Sub Stream (Fast / Low Latency)

    const playerEl = document.getElementById('player');
    const videoOverlay = document.getElementById('videoOverlay');
    const overlayText = document.getElementById('overlayText');
    const overlaySub = document.getElementById('overlaySub');
    const channelBadge = document.getElementById('channelBadge');
    const fpsBadge = document.getElementById('fpsBadge');

    channelBadge.innerText = channel === 1 ? 'CH 1 • FRONT' : 'CH 2 • CABIN';

    let ws = null;
    let jmuxer = null;
    let frameCount = 0;
    let lastFpsTime = Date.now();
    let hasSeenKeyframe = false;

    function initJMuxer() {
      hasSeenKeyframe = false;
      if (jmuxer) {
        try { jmuxer.destroy(); } catch (e) {}
        jmuxer = null;
      }

      playerEl.muted = true;
      playerEl.setAttribute('playsinline', '');
      playerEl.setAttribute('autoplay', '');

      try {
        jmuxer = new JMuxer({
          node: 'player',
          mode: 'video',
          flushingTime: 0,
          clearBuffer: true,
          fps: 25,
          debug: false,
          onError: function(data) {
            console.warn('JMuxer event:', data);
          }
        });
      } catch (e) {
        console.error('JMuxer init failed:', e);
      }

      playerEl.addEventListener('timeupdate', () => {
        if (playerEl.buffered && playerEl.buffered.length > 0) {
          const bufferEnd = playerEl.buffered.end(playerEl.buffered.length - 1);
          const lag = bufferEnd - playerEl.currentTime;
          if (lag > 0.35) {
            playerEl.currentTime = bufferEnd - 0.05;
          }
        }
      });

      playerEl.play().catch(() => {});
    }

    function isH264Keyframe(uint8) {
      for (let i = 0; i < Math.min(uint8.length - 4, 64); i++) {
        if (uint8[i] === 0x00 && uint8[i + 1] === 0x00 && (uint8[i + 2] === 0x01 || (uint8[i + 2] === 0x00 && uint8[i + 3] === 0x01))) {
          const nalByte = uint8[i + 2] === 0x01 ? uint8[i + 3] : uint8[i + 4];
          const nalType = nalByte & 0x1f;
          if (nalType === 7 || nalType === 8 || nalType === 5) {
            return true;
          }
        }
      }
      return false;
    }

    function handleVideoFrame(arrayBuffer) {
      frameCount++;
      const uint8 = new Uint8Array(arrayBuffer);

      if (!hasSeenKeyframe) {
        if (isH264Keyframe(uint8)) {
          hasSeenKeyframe = true;
        }
      }

      if (jmuxer) {
        jmuxer.feed({
          video: uint8
        });
      }

      if (videoOverlay && !videoOverlay.classList.contains('hidden')) {
        videoOverlay.classList.add('hidden');
      }

      if (playerEl.paused) {
        playerEl.play().catch(() => {});
      }

      const now = Date.now();
      if (now - lastFpsTime >= 1000) {
        const fps = Math.round((frameCount * 1000) / (now - lastFpsTime));
        fpsBadge.textContent = `${fps} FPS`;
        frameCount = 0;
        lastFpsTime = now;
      }
    }

    function connectWebSocket() {
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${protocol}//${window.location.host}/ws`;

      overlayText.textContent = `Connecting to VPS...`;
      ws = new WebSocket(wsUrl);
      ws.binaryType = 'arraybuffer';

      ws.onopen = () => {
        overlayText.textContent = `Requesting Channel ${channel}...`;
        overlaySub.textContent = `SIM: ${simNo} (Fast Sub Stream)`;
        
        ws.send(JSON.stringify({
          action: 'start_stream',
          simNo: simNo,
          channel: channel,
          streamType: streamType,
          mediaPort: 5023
        }));
      };

      ws.onmessage = (event) => {
        if (event.data instanceof ArrayBuffer) {
          handleVideoFrame(event.data);
          return;
        }

        try {
          const msg = JSON.parse(event.data);
          if (msg.type === 'stream_started') {
            overlayText.textContent = 'Stream Negotiated. Decoding Video...';
          }
        } catch (e) {}
      };

      ws.onclose = () => {
        videoOverlay.classList.remove('hidden');
        overlayText.textContent = 'Reconnecting...';
        overlaySub.textContent = 'Connection lost, retrying in 2s';
        setTimeout(connectWebSocket, 2000);
      };

      ws.onerror = () => {
        overlayText.textContent = 'Connection error, retrying...';
      };
    }

    document.addEventListener('DOMContentLoaded', () => {
      initJMuxer();
      connectWebSocket();

      document.body.addEventListener('click', () => {
        playerEl.play().catch(() => {});
      }, { once: true });
    });
  </script>
</body>
</html>
