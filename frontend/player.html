<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dashcam Mobile Player</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      background-color: #000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #player-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #000;
    }
    .hud-overlay {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 10;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      color: #fff;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
    }
    .badge-live {
      background: #dc2626;
      animation: pulse 2s infinite;
    }
    .badge-live::before {
      content: "";
      width: 6px;
      height: 6px;
      margin-right: 5px;
      background: #fff;
      border-radius: 50%;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }
    #status-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(15, 23, 42, 0.85);
      color: #fff;
      z-index: 20;
      transition: opacity 0.3s ease;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255, 255, 255, 0.2);
      border-top-color: #f97316;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 12px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .status-text {
      font-size: 13px;
      color: #e2e8f0;
      font-weight: 500;
    }
    .sub-text {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 4px;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/jmuxer@2.0.5/dist/jmuxer.min.js"></script>
</head>
<body>
  <div id="player-container">
    <video id="player" autoplay muted playsinline></video>
    
    <div class="hud-overlay">
      <div id="live-badge" class="badge badge-live">LIVE</div>
      <div id="cam-badge" class="badge">CH 1 • FRONT</div>
    </div>

    <div id="status-overlay">
      <div class="spinner"></div>
      <div id="status-text" class="status-text">Connecting to Camera VPS...</div>
      <div id="sub-text" class="sub-text">Waiting for H.264 video feed</div>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const simNo = urlParams.get('sim') || '015770054447';
    const channel = parseInt(urlParams.get('channel') || '1', 10);
    
    const camBadge = document.getElementById('cam-badge');
    camBadge.innerText = channel === 1 ? 'CH 1 • FRONT' : 'CH 2 • CABIN';

    const statusOverlay = document.getElementById('status-overlay');
    const statusText = document.getElementById('status-text');
    const subText = document.getElementById('sub-text');
    const videoElem = document.getElementById('player');

    let jmuxer = null;
    let ws = null;
    let frameCount = 0;

    function initMuxer() {
      try {
        jmuxer = new JMuxer({
          node: 'player',
          mode: 'video',
          flushingTime: 0,
          fps: 25,
          debug: false,
          onError: function(data) {
            console.warn('JMuxer Warning:', data);
          }
        });
      } catch (e) {
        console.error('JMuxer init failed:', e);
      }
    }

    function connectWs() {
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${protocol}//${window.location.host}/ws`;

      statusText.innerText = `Connecting (${simNo})...`;
      ws = new WebSocket(wsUrl);
      ws.binaryType = 'arraybuffer';

      ws.onopen = () => {
        statusText.innerText = 'Requesting Live Stream (0x9101)...';
        subText.innerText = `Channel ${channel} • SIM ${simNo}`;
        
        ws.send(JSON.stringify({
          action: 'start_stream',
          simNo: simNo,
          channel: channel,
          streamType: 0
        }));
      };

      ws.onmessage = (event) => {
        if (event.data instanceof ArrayBuffer) {
          frameCount++;
          if (frameCount === 3) {
            statusOverlay.style.opacity = '0';
            setTimeout(() => { statusOverlay.style.display = 'none'; }, 300);
            videoElem.play().catch(() => {});
          }
          if (jmuxer) {
            jmuxer.feed({
              video: new Uint8Array(event.data)
            });
          }
        } else {
          try {
            const msg = JSON.parse(event.data);
            if (msg.type === 'stream_started') {
              statusText.innerText = 'Handshake OK. Decoding Video...';
            }
          } catch (e) {}
        }
      };

      ws.onclose = () => {
        statusOverlay.style.display = 'flex';
        statusOverlay.style.opacity = '1';
        statusText.innerText = 'Reconnecting to VPS...';
        setTimeout(connectWs, 2500);
      };

      ws.onerror = () => {
        statusText.innerText = 'Connection Error. Retrying...';
      };
    }

    document.addEventListener('DOMContentLoaded', () => {
      initMuxer();
      connectWs();

      // Ensure autoplay on Android
      document.body.addEventListener('click', () => {
        videoElem.play().catch(() => {});
      }, { once: true });
    });
  </script>
</body>
</html>
